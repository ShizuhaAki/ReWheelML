[data]
train_dir = data/train
eval_dir = data/test
invert = true

[model]
num_classes = 12
blocks = 3
conv_channels = 32
channel_multiplier = 2
kernel_size = 3
hidden_size = 128
activation = relu
dropout = 0.1

[train]
lr = 0.001
epoches = 20
batch_size = 64
seed = 42
optimizer = adam
beta1 = 0.9
beta2 = 0.999
eps = 1e-8

[scheduler]
enabled = true
name = plateau
metric = eval_loss
mode = min
factor = 0.3
patience = 3
min_lr = 1e-5
threshold = 1e-4

[augment]
max_shift = 2
max_rotation_deg = 5.0
morphology_prob = 0.15
noise_std = 0.02

[checkpoint]
enabled = true
path = checkpoints/best_cnn_bs64.ckpt
metric = eval_loss
mode = min

[inference]
from_ckpt = true
