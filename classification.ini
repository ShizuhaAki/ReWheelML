[data]
train_dir = data/train
eval_dir = data/test
invert = true

[model]
num_classes = 12
hidden_size = 128
hidden_layers = 2
activation = relu
dropout = 0.2

[train]
lr = 0.001
epoches = 50
batch_size = 64
seed = 42
optimizer = adam
beta1 = 0.9
beta2 = 0.999
eps = 1e-8

[augment]
max_shift = 2
noise_std = 0.02

[checkpoint]
enabled = true
path = checkpoints/best_classification.ckpt
metric = eval_loss
mode = min
